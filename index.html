<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصلح | موشن ديزاينر ومحرر فيديو</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ee;--fg:#121212;--muted:#6d6b66;--accent:#ff4d2e;--accent2:#ffb02e;--card:#fff;--line:#e2dfd8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0d;--fg:#f4f2ee;--muted:#9b9992;--accent:#ff6a4d;--accent2:#ffc04d;--card:#17171a;--line:#2a2a2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0c0d;--fg:#f4f2ee;--muted:#9b9992;--accent:#ff6a4d;--accent2:#ffc04d;--card:#17171a;--line:#2a2a2e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;overflow-x:hidden}
.wrap{max-width:980px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* background blobs */
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;pointer-events:none}
.b1{width:340px;height:340px;background:var(--accent);top:-80px;left:-80px;animation:float1 14s ease-in-out infinite}
.b2{width:300px;height:300px;background:var(--accent2);bottom:-80px;right:-60px;animation:float2 17s ease-in-out infinite}
@keyframes float1{50%{transform:translate(120px,90px) scale(1.15)}}
@keyframes float2{50%{transform:translate(-110px,-80px) scale(1.2)}}
#glow{position:fixed;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0%,transparent 65%);opacity:.14;pointer-events:none;z-index:0;transform:translate(-50%,-50%);left:-999px;top:-999px;transition:opacity .3s}

/* hero */
header.hero{min-height:84vh;display:flex;flex-direction:column;justify-content:center;padding:56px 0 32px}
.tag{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-weight:500;font-size:15px;margin:0 0 14px}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 12px transparent}}
h1{font-size:clamp(64px,22vw,190px);line-height:.95;margin:0;font-weight:800;letter-spacing:-.01em}
h1 .ch{display:inline-block;opacity:0;transform:translateY(60%) rotate(6deg);animation:pop .8s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.role{font-size:clamp(18px,4.6vw,30px);color:var(--muted);margin:20px 0 0;font-weight:500;opacity:0;animation:up .8s .6s forwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.role b{color:var(--fg);font-weight:800}
.cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap;opacity:0;animation:up .8s .85s forwards}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:999px;font:inherit;font-weight:800;font-size:16px;text-decoration:none;cursor:pointer;border:1.5px solid var(--fg);color:var(--fg);background:transparent;transition:transform .25s,background .25s,color .25s}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.btn svg{width:20px;height:20px}

/* marquee */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding:14px 0;margin:8px 0 56px;direction:ltr;position:relative;z-index:1}
.track{display:flex;gap:40px;width:max-content;animation:run 22s linear infinite;font-size:clamp(22px,5vw,34px);font-weight:800;white-space:nowrap}
.track span:nth-child(even){color:var(--accent)}
@keyframes run{to{transform:translateX(-50%)}}

/* reveal */
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}

/* work + custom player */
section{padding:0 0 72px}
h2{font-size:clamp(26px,6vw,38px);margin:0 0 20px;font-weight:800}
h2::after{content:"";display:block;width:56px;height:4px;border-radius:2px;background:var(--accent);margin-top:10px}
.player{position:relative;width:100%;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#0b0b0c;border:1px solid var(--line);box-shadow:0 30px 70px -30px rgba(0,0,0,.45)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;border:0;width:100%;color:#fff;font:inherit;
background:radial-gradient(circle at 30% 20%,rgba(255,77,46,.55),transparent 55%),radial-gradient(circle at 80% 90%,rgba(255,176,46,.45),transparent 55%),#0b0b0c;background-size:140% 140%;animation:shift 9s ease-in-out infinite alternate;transition:opacity .4s}
@keyframes shift{to{background-position:100% 100%}}
.play{position:relative;width:88px;height:88px;border-radius:50%;background:var(--accent);display:grid;place-items:center;transition:transform .3s}
.play::before,.play::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ring 2.2s infinite}
.play::after{animation-delay:1.1s}
@keyframes ring{to{transform:scale(1.9);opacity:0}}
.play svg{width:34px;height:34px;fill:#fff;margin-left:4px}
.cover:hover .play{transform:scale(1.1)}
.cover small{font-size:16px;font-weight:500;opacity:.9}
.player.on .cover{opacity:0;pointer-events:none}
.open{display:inline-block;margin-top:14px;color:var(--muted);font-size:14px;text-decoration:none}
.open:hover{color:var(--accent)}

/* contact */
.ig{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
.ig p{margin:0;font-size:clamp(20px,4.5vw,28px);font-weight:800}
.ig span{display:block;color:var(--muted);font-size:15px;font-weight:400;direction:ltr;text-align:right}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:14px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,h1 .ch,.role,.cta{opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div id="glow"></div>

<div class="wrap">
  <header class="hero">
    <p class="tag"><i></i>بورتفوليو</p>
    <h1 id="name" aria-label="مصلح"></h1>
    <p class="role"><b>موشن ديزاينر</b> &nbsp;•&nbsp; <b>محرر فيديو</b></p>
    <div class="cta">
      <a class="btn main" href="#work">شاهد عملي</a>
      <a class="btn" href="https://www.instagram.com/moslihk9?srtk=c3dyN3V1eHRmcnY0" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
        انستغرام
      </a>
    </div>
  </header>
</div>

<div class="marquee" aria-hidden="true">
  <div class="track">
    <span>Motion Design</span><span>✦</span><span>Video Editing</span><span>✦</span><span>Motion Design</span><span>✦</span><span>Video Editing</span><span>✦</span>
    <span>Motion Design</span><span>✦</span><span>Video Editing</span><span>✦</span><span>Motion Design</span><span>✦</span><span>Video Editing</span><span>✦</span>
  </div>
</div>

<div class="wrap">
  <section id="work" class="rv">
    <h2>أعمالي</h2>
    <div class="player" id="player">
      <button class="cover" id="cover" aria-label="تشغيل المقطع">
        <span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>
        <small>اضغط للتشغيل</small>
      </button>
    </div>
    <a class="open" href="https://drive.google.com/file/d/1dbKzrBGHOC9gTqirKOCob6HwNDe4Pd2D/view" target="_blank" rel="noopener">فتح المقطع في Google Drive ↗</a>
  </section>

  <section class="rv">
    <h2>تواصل معي</h2>
    <div class="ig">
      <p>تابعني على انستغرام<span>@moslihk9</span></p>
      <a class="btn main" href="https://www.instagram.com/moslihk9?srtk=c3dyN3V1eHRmcnY0" target="_blank" rel="noopener">فتح الحساب</a>
    </div>
  </section>
</div>

<footer>© مصلح</footer>

<script>
// name animation
(function(){
  var h=document.getElementById("name"),t="مصلح";
  var s=document.createElement("span");s.className="ch";s.textContent=t;h.appendChild(s);
})();

// reveal on scroll
(function(){
  var els=document.querySelectorAll(".rv");
  if(!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in")});return}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.15});
  els.forEach(function(e){io.observe(e)});
})();

// cursor glow
(function(){
  var g=document.getElementById("glow");
  window.addEventListener("pointermove",function(e){g.style.left=e.clientX+"px";g.style.top=e.clientY+"px"});
})();

// custom player cover -> loads Drive video
(function(){
  var ID="1dbKzrBGHOC9gTqirKOCob6HwNDe4Pd2D";
  var p=document.getElementById("player"),c=document.getElementById("cover");
  c.addEventListener("click",function(){
    var f=document.createElement("iframe");
    f.src="https://drive.google.com/file/d/"+ID+"/preview";
    f.allow="autoplay; fullscreen";f.allowFullscreen=true;
    p.insertBefore(f,c);p.classList.add("on");
  });
})();
</script>
</body>
</html>
